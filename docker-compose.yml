version: '3.9'

services:
  printer:
    build:
      context: ../AddiPi-Printer-Service
      dockerfile: Dockerfile
    image: addipi/printer-service
    env_file:
      - .env
    ports:
      - "3050:3050"
    depends_on:
      - queue
      - auth
    restart: unless-stopped

  files:
    build:
      context: ../AddiPi-Files-Service
      dockerfile: Dockerfile
    image: addipi/files-service
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - auth
    restart: unless-stopped

  queue:
    build:
      context: ../AddiPi-Queue-Service
      dockerfile: Dockerfile
    image: addipi/queue-service
    env_file:
      - .env
    ports:
      - "3070:3070"
    depends_on:
      - auth
    restart: unless-stopped

  auth:
    build:
      context: ../AddiPi-Auth-Service
      dockerfile: Dockerfile
    image: addipi/auth-service
    env_file:
      - .env
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: addipi-network
