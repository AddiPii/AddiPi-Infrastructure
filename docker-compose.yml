version: '3.9'

services:
  printer:
    build:
      context: ../AddiPi-Printer-Service
      dockerfile: Dockerfile
    image: addipi/printer-service
    env_file:
      - .env
    ports:
      - "3050:3050"
    depends_on:
      - queue
    restart: unless-stopped

  files:
    build:
      context: ../AddiPi-Files-Service
      dockerfile: Dockerfile
    image: addipi/files-service
    env_file:
      - .env
    ports:
      - "3060:3060"
    restart: unless-stopped

  queue:
    build:
      context: ../AddiPi-Queue-Service
      dockerfile: Dockerfile
    image: addipi/queue-service
    env_file:
      - .env
    ports:
      - "3070:3070"
    restart: unless-stopped

networks:
  default:
    name: addipi-network
