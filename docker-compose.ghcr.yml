version: '3.9'

services:
  files:
    image: ${FILES_IMAGE:-ghcr.io/AddiPii/AddiPi-Files-Service:latest}
    env_file:
      - .env
    ports:
      - "${FILES_PORT:-5000}:5000"
    restart: unless-stopped
    networks:
      - addipi-network

  queue:
    image: ${QUEUE_IMAGE:-ghcr.io/AddiPii/AddiPi-Queue-Service:latest}
    env_file:
      - .env
    ports:
      - "${QUEUE_PORT:-4000}:4000"
    restart: unless-stopped
    networks:
      - addipi-network

  printer:
    image: ${PRINTER_IMAGE:-ghcr.io/AddiPii/AddiPi-Printer-Service:latest}
    env_file:
      - .env
    ports:
      - "${PRINTER_PORT:-3050}:3050"
    restart: unless-stopped
    networks:
      - addipi-network

  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    restart: unless-stopped

networks:
  addipi-network:
    name: addipi-network
